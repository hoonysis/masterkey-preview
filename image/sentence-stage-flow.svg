      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">5</text>
      <text class="stepName" x="118" y="39">+ 누구와</text>
      <text class="stepDesc" x="118" y="68">동반격 표현</text>
      <rect x="476" y="22" width="96" height="42" rx="21" fill="#07101b"/>
      <text class="count" x="524" y="52" text-anchor="middle">736개</text>
    </g>
    <g transform="translate(56 686)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">6</text>
      <text class="stepName" x="118" y="39">+ 무엇으로</text>
      <text class="stepDesc" x="118" y="68">도구격 표현</text>
      <rect x="476" y="22" width="96" height="42" rx="21" fill="#0e7f72"/>
      <text class="count" x="524" y="52" text-anchor="middle">816개</text>
    </g>
    <g transform="translate(56 782)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">7</text>
      <text class="stepName" x="118" y="39">+ 누구한테</text>
      <text class="stepDesc" x="118" y="68">여격 표현</text>
      <rect x="476" y="22" width="96" height="42" rx="21" fill="#07101b"/>
      <text class="count" x="524" y="52" text-anchor="middle">552개</text>
    </g>
    <g transform="translate(56 878)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">8</text>
      <text class="stepName" x="118" y="39">+ 어떤 거</text>
      <text class="stepDesc" x="118" y="68">보조사 표현</text>
      <rect x="476" y="22" width="96" height="42" rx="21" fill="#0e7f72"/>
      <text class="count" x="524" y="52" text-anchor="middle">138개</text>
    </g>
    <g transform="translate(56 974)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">9</text>
      <text class="stepName" x="118" y="39">+ 누구보다</text>
      <text class="stepDesc" x="118" y="68">비교격 표현</text>
      <rect x="476" y="22" width="96" height="42" rx="21" fill="#07101b"/>
      <text class="count" x="524" y="52" text-anchor="middle">394개</text>
    </g>
