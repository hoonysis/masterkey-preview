<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">9단계 문장 구성 목록</title>
  <desc id="desc">문장 발달 9단계와 단계별 문장 개수를 세로 목록으로 정리한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1420"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <style>
      .font{font-family:Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
      .statNum{font-size:48px;font-weight:950;fill:#0e7f72}
      .statLabel{font-size:21px;font-weight:900;fill:#111827}
      .stepName{font-size:35px;font-weight:950;fill:#07101b}
      .stepDesc{font-size:22px;font-weight:850;fill:#667085}
      .count{font-size:25px;font-weight:950;fill:#fff}
      .num{font-size:27px;font-weight:950;fill:#fff}
    </style>
  </defs>

  <rect width="720" height="1120" rx="34" fill="url(#bg)"/>
  <rect x="20" y="20" width="680" height="1080" rx="30" fill="none" stroke="#243653" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="56" y="54" width="286" height="118" rx="20" fill="#fff9ef" stroke="#e6ded0" stroke-width="2"/>
    <rect x="378" y="54" width="286" height="118" rx="20" fill="#fff9ef" stroke="#e6ded0" stroke-width="2"/>
  </g>
  <text class="font statNum" x="199" y="112" text-anchor="middle">9단계</text>
  <text class="font statLabel" x="199" y="146" text-anchor="middle">문장 발달 흐름</text>
  <text class="font statNum" x="521" y="112" text-anchor="middle">7,677개</text>
  <text class="font statLabel" x="521" y="146" text-anchor="middle">문장과 그림</text>

  <rect x="99" y="232" width="8" height="804" rx="4" fill="#0e7f72" opacity=".62"/>

  <g class="font" filter="url(#shadow)">
    <g transform="translate(56 206)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">1</text>
      <text class="stepName" x="118" y="39">두 단어</text>
      <text class="stepDesc" x="118" y="68">엄마 강아지</text>
      <rect x="476" y="22" width="96" height="42" rx="21" fill="#07101b"/>
      <text class="count" x="524" y="52" text-anchor="middle">814개</text>
    </g>
    <g transform="translate(56 302)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">2</text>
      <text class="stepName" x="118" y="39">세 단어</text>
      <text class="stepDesc" x="118" y="68">엄마가 사과 먹어요</text>
      <rect x="456" y="22" width="116" height="42" rx="21" fill="#0e7f72"/>
      <text class="count" x="514" y="52" text-anchor="middle">1,636개</text>
    </g>
    <g transform="translate(56 398)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">3</text>
      <text class="stepName" x="118" y="39">+ 누가</text>
      <text class="stepDesc" x="118" y="68">주격 표현</text>
      <rect x="456" y="22" width="116" height="42" rx="21" fill="#07101b"/>
      <text class="count" x="514" y="52" text-anchor="middle">1,565개</text>
    </g>
    <g transform="translate(56 494)">
      <rect width="608" height="84" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="42" r="35" fill="#0e7f72"/>
      <text class="num" x="50" y="52" text-anchor="middle">4</text>
      <text class="stepName" x="118" y="39">+ 어디</text>
      <text class="stepDesc" x="118" y="68">처소격 표현</text>
      <rect x="456" y="22" width="116" height="42" rx="21" fill="#0e7f72"/>
      <text class="count" x="514" y="52" text-anchor="middle">1,026개</text>
    </g>
    <g transform="translate(56 590)">
