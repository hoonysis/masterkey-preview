      <rect x="462" y="19" width="108" height="40" rx="20" fill="#0e7f72"/>
      <text class="count" x="516" y="48" text-anchor="middle">1,026개</text>
    </g>
    <g transform="translate(56 688)">
      <rect width="608" height="78" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="39" r="34" fill="#0e7f72"/>
      <text class="num" x="50" y="49" text-anchor="middle">5</text>
      <text class="stepName" x="118" y="36">+ 누구와</text>
      <text class="stepDesc" x="118" y="64">동반격 표현</text>
      <rect x="478" y="19" width="92" height="40" rx="20" fill="#07101b"/>
      <text class="count" x="524" y="48" text-anchor="middle">736개</text>
    </g>
