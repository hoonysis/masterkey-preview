<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1120" viewBox="0 0 720 1120" role="img" aria-labelledby="title desc">
  <title id="title">9단계 문장 발달 흐름과 7,677개 문장 구성</title>
  <desc id="desc">문장 발달 9단계와 단계별 문장 개수를 정리한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1420"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0f18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7f72"/>
      <stop offset="1" stop-color="#ee781b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .font{font-family:Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif}
      .title{font-size:50px;font-weight:950;fill:#fff9ef;letter-spacing:0}
      .sub{font-size:21px;font-weight:800;fill:#cfd8e3}
      .statNum{font-size:47px;font-weight:950;fill:#0e7f72}
      .statLabel{font-size:21px;font-weight:900;fill:#111827}
      .stepName{font-size:34px;font-weight:950;fill:#09111d}
      .stepDesc{font-size:22px;font-weight:850;fill:#667085}
      .count{font-size:25px;font-weight:950;fill:#fff}
      .num{font-size:27px;font-weight:950;fill:#fff}
      .footer{font-size:24px;font-weight:900;fill:#fff9ef}
    </style>
  </defs>

  <rect x="0" y="0" width="720" height="1120" rx="34" fill="url(#bg)"/>
  <rect x="22" y="22" width="676" height="1076" rx="28" fill="none" stroke="#203047" stroke-width="2"/>
  <path d="M82 155 C180 92, 269 119, 358 163 S538 212, 636 126" fill="none" stroke="#ffd85c" stroke-width="3" stroke-linecap="round" opacity=".26"/>
  <path d="M87 1001 C204 938, 303 968, 392 1006 S547 1057, 640 979" fill="none" stroke="#0e7f72" stroke-width="3" stroke-linecap="round" opacity=".24"/>

  <text class="font title" x="360" y="86" text-anchor="middle">문장 발달 9단계</text>
  <text class="font sub" x="360" y="124" text-anchor="middle">두 단어 표현부터 비교 표현까지 나눴습니다</text>

  <g filter="url(#softShadow)">
    <rect x="56" y="168" width="286" height="116" rx="20" fill="#fff9ef" stroke="#e6ded0" stroke-width="2"/>
    <rect x="378" y="168" width="286" height="116" rx="20" fill="#fff9ef" stroke="#e6ded0" stroke-width="2"/>
  </g>
  <text class="font statNum" x="199" y="224" text-anchor="middle">9단계</text>
  <text class="font statLabel" x="199" y="258" text-anchor="middle">문장 발달 흐름</text>
  <text class="font statNum" x="521" y="224" text-anchor="middle">7,677개</text>
  <text class="font statLabel" x="521" y="258" text-anchor="middle">문장과 그림</text>

  <rect x="99" y="322" width="8" height="626" rx="4" fill="#0e7f72" opacity=".62"/>

