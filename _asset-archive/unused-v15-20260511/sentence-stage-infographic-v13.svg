      <rect width="608" height="78" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="39" r="34" fill="#0e7f72"/>
      <text class="num" x="50" y="49" text-anchor="middle">6</text>
      <text class="stepName" x="118" y="36">+ 무엇으로</text>
      <text class="stepDesc" x="118" y="64">도구격 표현</text>
      <rect x="478" y="19" width="92" height="40" rx="20" fill="#0e7f72"/>
      <text class="count" x="524" y="48" text-anchor="middle">816개</text>
