      <rect width="288" height="78" rx="20" fill="#fff9ef"/>
      <circle cx="50" cy="39" r="34" fill="#0e7f72"/>
      <text class="num" x="50" y="49" text-anchor="middle">9</text>
      <text class="stepName" x="112" y="36" font-size="27">+ 누구보다</text>
